apiVersion: v1
kind: Pod
metadata:
  name: sectest-hostpath
  namespace: task-tracker
  labels:
    app.kubernetes.io/name: sectest
spec:
  containers:
    - name: test
      image: europe-west1-docker.pkg.dev/devops-498817/gitops-images/task-tracker-backend:latest
      command: ["sleep", "3600"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
